name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q bot.py web_app.py web_store.py bth_create tests
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check web/app.js

  optional-voice-stack:
    name: Optional voice dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve the complete optional voice stack
        run: python -m pip install --disable-pip-version-check --dry-run -r requirements-voice.txt
      - name: Install lightweight compatibility targets
        run: |
          python -m pip install --disable-pip-version-check pandas==3.0.6
          python -m pip install --disable-pip-version-check tltk==1.10 --no-deps
      - name: Test Thai tabular data and dependency pins
        run: python -m unittest tests.test_optional_voice_stack -v
